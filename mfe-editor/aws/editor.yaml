AWSTemplateFormatVersion: '2010-09-09'
Description: Editor Vue 3 con S3 privado y CloudFront OAC para el Shell TODO.

Parameters:
  ShellOrigin:
    Type: String
    Default: https://d1ykub9gcq8bmq.cloudfront.net
    AllowedPattern: 'https://[^/]+'
    ConstraintDescription: Usa el origen HTTPS del Shell sin barra final.

Resources:
  EditorBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ShellOrigin]
            AllowedMethods: [GET, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 600

  EditorOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  EditorCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  EditorResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-cors'
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowOrigins:
            Items: [!Ref ShellOrigin]
          AccessControlAllowMethods:
            Items: [GET, HEAD]
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true

  EditorDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} - Editor Vue 3'
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: editor-s3
            DomainName: !GetAtt EditorBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt EditorOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: editor-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref EditorCachePolicy
          ResponseHeadersPolicyId: !Ref EditorResponseHeaders
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  EditorBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EditorBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEditorCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${EditorBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${EditorDistribution}'

Outputs:
  BucketName:
    Value: !Ref EditorBucket
  DistributionId:
    Value: !Ref EditorDistribution
  EditorUrl:
    Value: !Sub 'https://${EditorDistribution.DomainName}/todo-editor.js'
